<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <path id="textCircle" d="M 150, 150 m -115, 0 a 115,115 0 1,1 230,0 a 115,115 0 1,1 -230,0" />
    <linearGradient id="sealChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C7C7CC" />
      <stop offset="100%" stop-color="#3A3A3C" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" fill="#050505" />

  <!-- Outer Concentric Rings -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
  <circle cx="150" cy="150" r="136" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3,3" />
  <circle cx="150" cy="150" r="95" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Circular Running Text -->
  <text fill="#8E8E93" font-family="'Courier New', monospace" font-size="8.8" letter-spacing="3.8" font-weight="bold">
