    <polygon points="132,88 140,93 120,114" fill="#FF3300" />
    <circle cx="158" cy="154" r="5" fill="#FF3300" />
  </g>

  <!-- Center Crosshairs -->
  <line x1="150" y1="18" x2="150" y2="28" stroke="#FF3300" stroke-width="1.5" />
  <line x1="150" y1="272" x2="150" y2="282" stroke="#FF3300" stroke-width="1.5" />
  <line x1="18" y1="150" x2="28" y2="150" stroke="#FF3300" stroke-width="1.5" />
