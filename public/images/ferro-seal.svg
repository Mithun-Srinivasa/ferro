  <!-- Central Brutalist 'F' Glyph -->
  <g transform="translate(100, 95) scale(0.5)">
    <polygon points="46,36 74,36 74,164 46,150" fill="url(#sealChrome)" />
    <polygon points="74,36 156,36 142,64 74,64" fill="url(#sealChrome)" />
